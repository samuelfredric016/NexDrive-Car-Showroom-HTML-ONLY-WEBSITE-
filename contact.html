        <h2>Contact Us</h2>

        <p><strong>Showroom:</strong> NexDrive Car Showroom</p>

        <p><strong>Address:</strong> Infopark Road, Kochi, Kerala, India</p>

        <p><strong>Phone:</strong> +91 98765 43210</p>

        <p><strong>Email:</strong> info@nexdrive.com</p>

        <h3>Book a Test Drive</h3>

        <form>

            <label>Full Name:</label>
            <br>
            <input type="text" name="name">

            <br><br>

            <label>Email:</label>
            <br>
            <input type="email" name="email">

            <br><br>

            <label>Phone Number:</label>
            <br>
            <input type="tel" name="phone">

            <br><br>

            <label>Select Car:</label>
            <br>

            <select name="car">

                <option>NexDrive X1</option>
                <option>NexDrive S5</option>
                <option>NexDrive Z7</option>
                <option>NexDrive R8</option>

            </select>

            <br><br>

            <label>Preferred Date:</label>
            <br>
            <input type="date" name="date">

            <br><br>

            <label>Message:</label>
            <br>

            <textarea rows="5" cols="40"></textarea>

            <br><br>

            <input type="submit" value="Book Test Drive">

        </form>

    </main>
